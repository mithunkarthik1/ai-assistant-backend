services:
  # Development-only Project API. Replace this service with the real Project
  # API before production use.
  project-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mock_project_api
    restart: unless-stopped
    command: ["uvicorn", "src.project_api_mock.main:app", "--host", "0.0.0.0", "--port", "9000"]
    ports:
      - "9000:9000"
    volumes:
      - ./src:/app/src
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/api/v1/projects/PROJ-123"]
      interval: 3s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag_backend
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file:
      - .env
    depends_on:
      project-api:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./src:/app/src
    extra_hosts:
      - "host.docker.internal:host-gateway"

