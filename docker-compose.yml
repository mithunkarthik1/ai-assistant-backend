services:
  db:
    image: pgvector/pgvector:pg16
    container_name: rag_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: rag_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rag_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  # Development-only Project API. Replace this service with the real Project
  # API before production use.
  project-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mock_project_api
    restart: unless-stopped
    command: ["uvicorn", "src.project_api_mock.main:app", "--host", "0.0.0.0", "--port", "9000"]
    ports:
      - "9000:9000"
    volumes:
      - ./src:/app/src
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/api/v1/projects/PROJ-123"]
      interval: 3s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag_backend
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:password123@db:5432/rag_db
      - PROJECT_API_BASE_URL=http://project-api:9000
      - PROJECT_API_PATH_PREFIX=/api/v1/projects
    depends_on:
      db:
        condition: service_healthy
      project-api:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./src:/app/src
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
